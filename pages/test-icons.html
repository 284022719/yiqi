<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>职业图标测试 - 一起公会</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <div class="guild-header-container"></div>
  <nav class="nav-container" aria-label="主菜单"></nav>
  
  <main class="main-content">
    <article class="content-card">
      <header>
        <h1>职业图标测试</h1>
        <p>测试职业图标是否正确显示</p>
      </header>
      
      <section>
        <h2>直接显示图标</h2>
        <div class="test-grid">
          <div class="test-item">
            <img src="https://wow.res.netease.com/pc/zt/20240820173221/assets/career-icon1_3c105fbd.png" alt="战士" style="width: 32px; height: 32px;">
            <span>战士</span>
          </div>
          <div class="test-item">
            <img src="https://wow.res.netease.com/pc/zt/20240820173221/assets/career-icon7_01967e0b.png" alt="圣骑士" style="width: 32px; height: 32px;">
            <span>圣骑士</span>
          </div>
          <div class="test-item">
            <img src="https://wow.res.netease.com/pc/zt/20240820173221/assets/career-icon2_fd85fd71.png" alt="猎人" style="width: 32px; height: 32px;">
            <span>猎人</span>
          </div>
        </div>
      </section>
      
      <section>
        <h2>JavaScript API 测试</h2>
        <div id="js-test-results"></div>
        <button id="test-js-api" class="button">测试 JavaScript API</button>
      </section>
    </article>
  </main>
  
  <footer class="footer-container"></footer>
  
  <script type="module">
    import { getClassInfo, getClassColor, getClassIcon } from '../js/data/wow-classes.js';
    
    document.getElementById('test-js-api').addEventListener('click', () => {
      const results = document.getElementById('js-test-results');
      const warriorInfo = getClassInfo('warrior');
      const paladinColor = getClassColor('paladin');
      const mageIcon = getClassIcon('mage');
      
      results.innerHTML = `
        <h3>测试结果：</h3>
        <ul>
          <li>战士信息: ${warriorInfo.name} (${warriorInfo.color})</li>
          <li>圣骑士颜色: ${paladinColor}</li>
          <li>法师图标URL: ${mageIcon}</li>
          <li>法师图标显示: <img src="${mageIcon}" alt="法师" style="width: 32px; height: 32px;"></li>
        </ul>
      `;
    });
  </script>
  
  <style>
    .test-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      margin: 1rem 0;
    }
    
    .test-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      border-radius: var(--border-radius);
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--color-border);
    }
    
    #js-test-results {
      margin: 1rem 0;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.2);
      border-radius: var(--border-radius);
    }
  </style>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="一起公会 - WCL战斗记录">
  <title>一起公会 - WCL数据</title>
      <link rel="stylesheet" href="../css/main.css">
  <link rel="icon" href="../img/favicon/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
  <!-- 网站头部 -->
  <div class="guild-header-container"></div>
  <nav class="nav-container" aria-label="主菜单"></nav>

  <main class="main-content">
    <section class="content-card">
      <header>
        <div class="header-content">
          <div>
            <h2>近期团队活动报告</h2>
            <p class="section-description">查看公会最新的团队副本进度和战斗记录</p>
          </div>
          <button id="refresh-btn" class="refresh-button" title="刷新数据">
            <i class="fas fa-sync-alt"></i>
          </button>
        </div>
      </header>
      <div id="loading" class="loading">
        <i class="fas fa-spinner fa-spin"></i> 正在加载WCL数据...
      </div>
      <div id="error" class="error" style="display: none;"></div>
      <div class="table-responsive">
        <table id="wcl-table" class="table">
          <caption class="visually-hidden">WCL战斗记录</caption>
          <thead>
            <tr>
              <th scope="col">日期</th>
              <th scope="col">副本</th>
              <th scope="col">进度</th>
              <th scope="col">上传者</th>
              <th scope="col">操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  
  <script type="module" src="../js/main.js"></script>
</body>
</html>

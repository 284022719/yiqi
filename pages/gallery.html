<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="一起公会 - 公会画廊">
  <title>公会画廊 - 一起公会</title>
      <link rel="stylesheet" href="../css/main.css">
  <link rel="icon" href="../img/favicon/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <div class="guild-header-container"></div>
  <nav class="nav-container" aria-label="主菜单"></nav>
  <main class="main-content">
    <article class="content-card">
      <header>
        <h2>公会画廊</h2>
      </header>
      <form id="upload-form" action="/.netlify/functions/handle-upload" class="upload-form" method="POST" enctype="multipart/form-data">
        <div class="upload-grid">
          <div class="upload-media">
            <label for="image-upload" class="file-upload-label">
              <i class="fas fa-cloud-upload-alt"></i> 选择图片
            </label>
            <input type="file" id="image-upload" name="image" accept="image/jpeg,image/png,image/webp" required>
            <div class="preview-container" id="drop-zone">
              <img id="image-preview" class="preview-image" alt="图片预览" style="display: none;">
              <p id="preview-placeholder" class="preview-placeholder">点击选择，或把图片拖到这里</p>
            </div>
            <p class="upload-hint">支持 JPEG / PNG / WEBP，单张不超过 10MB</p>
          </div>

          <div class="upload-meta">
            <div class="form-group">
              <label for="image-description">图片描述（可选）</label>
              <input type="text" id="image-description" name="description" maxlength="200" placeholder="例如：2025 年公会合影">
            </div>
            <button type="submit" class="button">
              <i class="fas fa-upload"></i> 上传图片
            </button>
            <div id="upload-status" class="upload-status" role="status" aria-live="polite"></div>
          </div>
        </div>
      </form>
      <div id="gallery" class="gallery gallery-skeleton" aria-busy="true">
        <div class="gallery-skeleton-item">
          <span class="skeleton skeleton-media"></span>
          <span class="skeleton skeleton-caption"></span>
        </div>
        <div class="gallery-skeleton-item">
          <span class="skeleton skeleton-media"></span>
          <span class="skeleton skeleton-caption"></span>
        </div>
        <div class="gallery-skeleton-item">
          <span class="skeleton skeleton-media"></span>
          <span class="skeleton skeleton-caption"></span>
        </div>
        <div class="gallery-skeleton-item">
          <span class="skeleton skeleton-media"></span>
          <span class="skeleton skeleton-caption"></span>
        </div>
        <div class="gallery-skeleton-item">
          <span class="skeleton skeleton-media"></span>
          <span class="skeleton skeleton-caption"></span>
        </div>
        <div class="gallery-skeleton-item">
          <span class="skeleton skeleton-media"></span>
          <span class="skeleton skeleton-caption"></span>
        </div>
      </div>
    </article>
  </main>
  <script type="module" src="../js/main.js"></script>
</body>
</html>

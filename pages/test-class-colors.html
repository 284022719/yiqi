<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>职业颜色系统测试 - 一起公会</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <div class="guild-header-container"></div>
  <nav class="nav-container" aria-label="主菜单"></nav>
  
  <main class="main-content">
    <article class="content-card">
      <header>
        <h1>职业颜色系统测试</h1>
        <p>测试所有职业颜色和功能是否正常工作</p>
      </header>
      
      <section>
        <h2>CSS变量测试</h2>
        <div class="test-grid">
          <div class="test-item" style="background-color: var(--class-warrior); color: var(--class-text-light);">
            战士
          </div>
          <div class="test-item" style="background-color: var(--class-paladin); color: var(--class-text-dark);">
            圣骑士
          </div>
          <div class="test-item" style="background-color: var(--class-hunter); color: var(--class-text-dark);">
            猎人
          </div>
          <div class="test-item" style="background-color: var(--class-rogue); color: var(--class-text-dark);">
            潜行者
          </div>
          <div class="test-item" style="background-color: var(--class-priest); color: var(--class-text-dark); border: 1px solid #CCC;">
            牧师
          </div>
        </div>
      </section>
      
      <section>
        <h2>工具类测试</h2>
        <div class="test-grid">
          <div class="test-item class-color-warrior">战士背景</div>
          <div class="test-item class-color-paladin">圣骑士背景</div>
          <div class="test-item class-color-hunter">猎人背景</div>
          <div class="test-item class-color-rogue">潜行者背景</div>
          <div class="test-item class-color-priest">牧师背景</div>
        </div>
      </section>
      
      <section>
        <h2>JavaScript API 测试</h2>
        <div id="js-test-results"></div>
        <button id="test-js-api" class="button">测试 JavaScript API</button>
      </section>
    </article>
  </main>
  
  <footer class="footer-container"></footer>
  
  <script type="module">
    import { getClassInfo, getClassColor } from '../js/data/wow-classes.js';
    
    document.getElementById('test-js-api').addEventListener('click', () => {
      const results = document.getElementById('js-test-results');
      const warriorInfo = getClassInfo('warrior');
      const paladinColor = getClassColor('paladin');
      
      results.innerHTML = `
        <h3>测试结果：</h3>
        <ul>
          <li>战士信息: ${warriorInfo.name} (${warriorInfo.color})</li>
          <li>圣骑士颜色: ${paladinColor}</li>
        </ul>
      `;
    });
  </script>
  
  <style>
    .test-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      margin: 1rem 0;
    }
    
    .test-item {
      padding: 1rem;
      border-radius: var(--border-radius);
      text-align: center;
      font-weight: bold;
      border: 1px solid var(--color-border);
    }
    
    #js-test-results {
      margin: 1rem 0;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.2);
      border-radius: var(--border-radius);
    }
  </style>
</body>
</html>

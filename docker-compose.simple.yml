# Docker Compose简化配置 - 易骑公会项目

services:
  # 前端服务
  frontend:
    build:
      context: ./frontend-refactor
      dockerfile: Dockerfile.simple
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:8000
    networks:
      - yiqi-network

  # 后端服务
  backend:
    build:
      context: ./backend-refactor
      dockerfile: Dockerfile.simple
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite:///./data/database/guild.db
      - CACHE_DIR=./data/cache
      - LOG_DIR=./data/logs
    volumes:
      - ./data:/app/data
    networks:
      - yiqi-network

networks:
  yiqi-network:
    driver: bridge 
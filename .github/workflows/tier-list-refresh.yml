name: 天梯数据刷新

# 定期从 Wowhead guide 抓取职业天梯，有变化就提交到 main。
# 抓取脚本的三种取页方式见 tools/fetch_tier_lists.py 顶部说明；
# GitHub Runner 在美国出口，正常情况下 direct 直连即可（本机则常被地区拦截，要用 --reader）。
on:
  schedule:
    - cron: '0 2 * * 1'   # 每周一 UTC 02:00 = 北京时间 10:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 检查是否有新数据
        id: diff
        run: |
          set +e
          python tools/fetch_tier_lists.py --check
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 1 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "抓取或解析失败（退出码 $code），不做提交" >&2
            exit "$code"
          fi

      - name: 重新生成数据
        if: steps.diff.outputs.changed == 'true'
        run: python tools/fetch_tier_lists.py

      # 新专精没登记时脚本会直接失败，这里再让测试兜一层：
      # 天梯里的每个专精 id 都必须能在 specs.js 解析出来。
      - name: JS 测试
        if: steps.diff.outputs.changed == 'true'
        run: node --test

      - name: 提交
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data
          if git diff --cached --quiet; then
            echo "没有实际改动，跳过提交"
            exit 0
          fi
          git commit -m "data(tier): 自动更新职业天梯（Wowhead）"
          git push

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="一起公会 - 公会成员名单">
  <title>公会成员名单 - 一起公会</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="icon" href="./public/favicon/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
  <div class="guild-header-container"></div>
  <nav class="nav-container" aria-label="主菜单"></nav>
  
  <main class="main-content">
    <!-- 页面标题 -->
    <article class="content-card">
      <header>
        <h1><i class="fas fa-users"></i> 公会成员名单</h1>
        <p>查看公会所有成员的详细信息</p>
      </header>
    </article>

    <!-- 统计摘要 -->
    <article class="content-card">
      <header>
        <h2><i class="fas fa-chart-bar"></i> 公会统计</h2>
      </header>
      <div class="stats-summary" id="stats-summary">
        <div class="loading">正在加载统计数据...</div>
      </div>
    </article>
    
    <!-- 搜索和筛选 -->
    <article class="content-card">
      <header>
        <h2><i class="fas fa-search"></i> 搜索和筛选</h2>
      </header>
      <div class="search-filters">
        <div class="search-row">
          <input type="text" id="search-input" class="search-input" placeholder="搜索角色名或服务器...">
          <select id="class-filter" class="filter-select">
            <option value="">所有职业</option>
          </select>
          <select id="realm-filter" class="filter-select">
            <option value="">所有服务器</option>
          </select>
          <select id="faction-filter" class="filter-select">
            <option value="">所有阵营</option>
            <option value="Horde">部落</option>
            <option value="Alliance">联盟</option>
          </select>
          <button id="search-btn" class="button">
            <i class="fas fa-search"></i> 搜索
          </button>
          <button id="reset-btn" class="button button-secondary">
            <i class="fas fa-redo"></i> 重置
          </button>
        </div>
      </div>
    </article>
    
    <!-- 成员表格 -->
    <article class="content-card">
      <header>
        <h2><i class="fas fa-table"></i> 成员列表</h2>
        <div class="table-controls">
          <div class="items-per-page">
            <label for="items-per-page">每页显示:</label>
            <select id="items-per-page" class="filter-select">
              <option value="10">10</option>
              <option value="25" selected>25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </div>
        </div>
      </header>
      
      <div class="table-container">
        <table class="members-table" id="members-table">
          <thead>
            <tr>
              <th class="sortable" data-sort="name">
                角色名 <i class="fas fa-sort"></i>
              </th>
              <th class="sortable" data-sort="realm_name">
                服务器 <i class="fas fa-sort"></i>
              </th>
              <th class="sortable" data-sort="class">
                职业 <i class="fas fa-sort"></i>
              </th>
              <th class="sortable" data-sort="level">
                等级 <i class="fas fa-sort"></i>
              </th>
              <th class="sortable" data-sort="mythic_score">
                Mythic+评分 <i class="fas fa-sort"></i>
              </th>
              <th class="sortable" data-sort="achievement_points">
                成就点数 <i class="fas fa-sort"></i>
              </th>
              <th class="sortable" data-sort="average_item_level">
                装等 <i class="fas fa-sort"></i>
              </th>
              <th class="sortable" data-sort="last_online_days">
                最后在线 <i class="fas fa-sort"></i>
              </th>
              <th class="sortable" data-sort="faction">
                阵营 <i class="fas fa-sort"></i>
              </th>
            </tr>
          </thead>
          <tbody id="members-tbody">
            <tr>
              <td colspan="9" class="loading">正在加载成员数据...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </article>
    
    <!-- 分页 -->
    <article class="content-card" id="pagination-container" style="display: none;">
      <div class="pagination" id="pagination">
        <button class="button" id="prev-page" disabled>
          <i class="fas fa-chevron-left"></i> 上一页
        </button>
        <span id="page-info">第 1 页，共 1 页</span>
        <button class="button" id="next-page" disabled>
          下一页 <i class="fas fa-chevron-right"></i>
        </button>
      </div>
    </article>
  </main>

  <footer class="footer-container"></footer>

  <script type="module" src="./js/main.js"></script>
  <script src="./js/guild_members.js"></script>
</body>
</html>
